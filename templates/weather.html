<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Neckrone8x Weather</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #0f172a,
                #1e3a8a
            );

            color: white;

        }


        .weather-card {
    width: min(1100px, 95vw);
    max-width: 1100px;

    padding: 35px;

    border-radius: 25px;

    background: rgba(255, 255, 255, 0.12);

    backdrop-filter: blur(15px);

    box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.3);

    text-align: center;
}


        .brand {

            font-size: 14px;

            letter-spacing: 2px;

            opacity: 0.7;

            margin-bottom: 20px;

        }


        /* ==========================
           SEARCH BOX
        ========================== */

        .search-box {

            display: flex;

            flex-direction: row;

            align-items: center;

            gap: 8px;

            margin-bottom: 10px;

            width: 100%;

        }


        .search-box input {

            flex: 1;

            width: 100%;

            min-width: 0;

            padding: 11px;

            border: none;

            border-radius: 10px;

            outline: none;

            font-size: 14px;

        }


        .search-box button {

            flex-shrink: 0;

            padding: 11px 15px;

            border: none;

            border-radius: 10px;

            cursor: pointer;

            font-weight: bold;

        }


        .search-box button:hover {

            opacity: 0.8;

        }

        /* =================================
   SEARCH INPUT + CLEAR BUTTON
================================= */

.search-input-wrapper {

    position: relative;

    flex: 1;

}

.search-input-wrapper input {

    width: 100%;

    padding-right: 42px;

    box-sizing: border-box;

}

#clear-search {

    position: absolute;

    right: 10px;

    top: 50%;

    transform: translateY(-50%);

    border: none !important;

    background: transparent !important;

    background-color: transparent !important;

    color: #000000 !important;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    opacity: 0.8;

    display: none;

    z-index: 9999;

    box-shadow: none !important;

    outline: none;

}
#clear-search:hover,
#clear-search:focus,
#clear-search:active {

    background: transparent !important;

    background-color: transparent !important;

    box-shadow: none !important;

    outline: none !important;

}

        /* ==========================
           ERROR MESSAGE
        ========================== */

        .error-message {

            min-height: 20px;

            margin-top: 0;

            margin-bottom: 15px;

            font-size: 13px;

            text-align: center;

            color: #ffb4b4;

        }


        /* ==========================
           CITY
        ========================== */

        .city {

            font-size: 28px;

            margin: 5px 0;

        }


        /* ==========================
           DATE
        ========================== */

        .date {

            font-size: 14px;

            opacity: 0.75;

            margin-bottom: 5px;

        }


        /* ==========================
           TIME
        ========================== */

        .time {

            font-size: 32px;

            font-weight: bold;

            margin-bottom: 20px;

        }


        /* ==========================
           WEATHER ICON
        ========================== */

        .weather-icon {

            font-size: 65px;

            margin: 10px 0;

        }


        /* ==========================
           TEMPERATURE
        ========================== */

        .temperature {

            font-size: 55px;

            font-weight: bold;

        }


        /* ==========================
           CONDITION
        ========================== */

        .condition {

            text-transform: capitalize;

            font-size: 18px;

            margin-bottom: 25px;

        }


        /* ==========================
           WEATHER DETAILS
        ========================== */

        .details {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;

        }


        .detail {

            padding: 14px;

            border-radius: 15px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.1
                );

        }


        .detail-title {

            font-size: 12px;

            opacity: 0.7;

        }


        .detail-value {

            margin-top: 5px;

            font-size: 16px;

            font-weight: bold;

        }


        /* ==========================
           FOOTER
        ========================== */

        .footer {

            margin-top: 25px;

            font-size: 12px;

            opacity: 0.5;

        }

        .location-button {
    width: 100%;

    padding: 11px;

    margin-bottom: 15px;

    border: none;

    border-radius: 10px;

    cursor: pointer;

    font-size: 14px;

    font-weight: bold;
}

.location-button:hover {
    opacity: 0.8;
}

/* ==========================
   5-DAY FORECAST
========================== */

.forecast-title {
    margin-top: 25px;
    margin-bottom: 12px;

    font-size: 13px;
    letter-spacing: 1px;

    font-weight: bold;

    opacity: 0.8;
}


.forecast {
    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    gap: 6px;
}


.forecast-day {
    padding: 10px 5px;

    border-radius: 12px;

    background:
        rgba(

            255,
            255,
            0.1

}

    font-weight: bold;
}


.forecast-icon {

}


.forecast-high {

    font-weight: bold;
}


.forecast-low {

    margin-top: 2px;
}


.forecast-rain {

    margin-top: 6px;

    opacity: 0.8;
}


.forecast-condition {
    font-size: 9px;

    opacity: 0.7;

    margin-top: 4px;
}

/* =================================
   LOCATION RESULTS
================================= */

#location-results {

    width: 100%;

    max-width: 900px;

    max-height: 360px;

    margin: 18px auto;

    overflow-y: auto;

    padding: 0 8px 8px 0;

    box-sizing: border-box;

}


/* =================================
   LOCATION RESULT BUTTON
================================= */

.location-result {

    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: flex-start;

    gap: 5px;

    margin-bottom: 10px;

    padding: 16px 20px;

    border: none;

    border-radius: 14px;

    background:
        rgba(255, 255, 255, 0.12);

    color: white;

    text-align: left;

    cursor: pointer;

    transition:
        transform 0.2s ease,
        background 0.2s ease;

}


/* =================================
   LOCATION HOVER
================================= */

.location-result:hover {

    background:
        rgba(255, 255, 255, 0.20);

    transform: translateY(-2px);

}


/* =================================
   LOCATION NAME
================================= */

.location-result strong {

    font-size: 17px;

    font-weight: 700;

}


/* =================================
   LOCATION DETAILS
================================= */

.location-result small {

    font-size: 14px;

    opacity: 0.75;

}


/* =================================
   SCROLLBAR
================================= */

#location-results::-webkit-scrollbar {

    width: 8px;

}


#location-results::-webkit-scrollbar-track {

}


#location-results::-webkit-scrollbar-thumb {

}


#location-results::-webkit-scrollbar-thumb:hover {

<script>

    // =================================
// LIVE DATE AND TIME
// =================================

let selectedTimezoneOffset = 0;


// ---------------------------------
// UPDATE CLOCK
// ---------------------------------

function updateClock() {

    // Get current UTC time
    const now = new Date();

    // Convert current time to milliseconds
    const utcTime =
        now.getTime() +
        (
            now.getTimezoneOffset() * 60000
        );

    // Apply selected location timezone
    const locationTime =
        new Date(
            utcTime +
            (
                selectedTimezoneOffset * 1000
            )
        );


    // ---------------------------------
    // DATE
    // ---------------------------------

    const date =
        locationTime.toLocaleDateString(
            "en-KE",
            {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric"
            }
        );


    // ---------------------------------
    // TIME
    // ---------------------------------

    const time =
        locationTime.toLocaleTimeString(
            "en-KE",
            {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            }
        );


    // ---------------------------------
    // DISPLAY
    // ---------------------------------

    document.getElementById(
        "date"
    ).textContent = date;

    document.getElementById(
        "time"
    ).textContent = time;

}


// Start clock
updateClock();


// Update every second
setInterval(
    updateClock,
    1000
);


    // =================================
    // WEATHER ICON
    // =================================

    function getWeatherIcon(weatherMain) {

        if (weatherMain === "Clear") {
            return "☀️";
        }

        if (weatherMain === "Clouds") {
            return "☁️";
        }

        if (weatherMain === "Rain") {
            return "🌧️";
        }

        if (weatherMain === "Drizzle") {
            return "🌦️";
        }

        if (weatherMain === "Thunderstorm") {
            return "⛈️";
        }

        if (
            weatherMain === "Mist" ||
            weatherMain === "Fog" ||
            weatherMain === "Haze"
        ) {
            return "🌫️";
        }

        return "🌤️";

    }


    // =================================
    // FORMAT SUNRISE / SUNSET
    // =================================

    function formatTime(
        timestamp,
        timezone
    ) {

        const date =
            new Date(
                (timestamp + timezone) * 1000
            );

        return date
            .toISOString()
            .substring(
                11,
                16
            );

    }


    // =================================
    // COUNTRY NAME
    // =================================

    function getCountryName(
        countryCode
    ) {

        if (!countryCode) {
            return "";
        }

        try {

            return new Intl.DisplayNames(
                ["en"],
                {
                    type: "region"
                }
            ).of(countryCode);

        }

        catch {

            return countryCode;

        }

    }


    // =================================
    // DAY / NIGHT THEME
    // =================================

    function updateTheme(
        sunrise,
        sunset,
        timezone
    ) {

        const now =
            Math.floor(
                Date.now() / 1000
            );

        const localTime =
            now + timezone;

        const localSunrise =
            sunrise + timezone;

        const localSunset =
            sunset + timezone;

        const body =
            document.body;

        const card =
            document.querySelector(
                ".weather-card"
            );


        if (
            localTime >= localSunrise &&
            localTime < localSunset
        ) {

            body.classList.add(
                "day-theme"
            );

            body.classList.remove(
                "night-theme"
            );


            if (card) {

                card.classList.add(
                    "day-theme"
                );

                card.classList.remove(
                    "night-theme"
                );

            }

        }

        else {

            body.classList.add(
                "night-theme"
            );

            body.classList.remove(
                "day-theme"
            );


            if (card) {

                card.classList.add(
                    "night-theme"
                );

                card.classList.remove(
                    "day-theme"
                );

            }

        }

    }


    // =================================
    // DISPLAY CURRENT WEATHER
    // =================================

    function displayWeather(data) {


        // =================================
        // CHECK RESPONSE
        // =================================

        if (
            data.cod !== 200 &&
            data.cod !== "200"
        ) {

            document.getElementById(
                "error-message"
            ).textContent =
                "City not found. Please try again.";

            document.getElementById(
                "condition"
            ).textContent =
                "Weather unavailable.";

            return;

        }


        document.getElementById(
            "error-message"
        ).textContent = "";


        // =================================
        // WEATHER INFORMATION
        // =================================

        const temperature =
            data.main.temp;

        const feelsLike =
            data.main.feels_like;

        const humidity =
            data.main.humidity;

        const wind =
            data.wind.speed;

        const clouds =
            data.clouds.all;

        const condition =
            data.weather[0].description;

        const weatherMain =
            data.weather[0].main;


        // =================================
        // LOCATION INFORMATION
        // =================================

        const cityName =

    // =================================
    // RENDER FORECAST
    // =================================

    function renderForecast(
        data
    ) {

        const forecastContainer =
            document.getElementById(
                "forecast"
            );


        if (!forecastContainer) {
            return;
        }


        // =================================
        // CHECK RESPONSE
        // =================================

        if (
            data.cod !== "200" &&
            data.cod !== 200
        ) {

            forecastContainer.innerHTML =
                "Forecast unavailable.";

            return;

        }


        // =================================
        // DISPLAY LOCATION
        // =================================

        displayForecastLocation(
            data
        );


        // =================================
        // GROUP BY DATE
        // =================================

        const days = {};


        data.list.forEach(
            item => {

                const dateString =
                    item.dt_txt.split(
                        " "
                    )[0];


                if (
                    !days[dateString]
                ) {

                    days[dateString] = [];

                }


                days[dateString].push(
                    item
                );

            }
        );


        // =================================
// NEXT 5 DAYS
// =================================

const dates =
    Object.keys(
        days
    ).slice(
        1,
        6
    );

        forecastContainer.innerHTML =
            "";


        // =================================
        // CREATE EACH DAY
        // =================================

        dates.forEach(
            dateString => {

                const entries =
                    days[dateString];


                // =================================
                // TEMPERATURES
                // =================================

                const temperatures =
                    entries.map(
                        item =>
                            item.main.temp
                    );


                const high =
                    Math.max(
                        ...temperatures
                    );


                const low =
                    Math.min(
                        ...temperatures
                    );


                // =================================
                // CONDITION COUNTERS
                // =================================

                let clear = 0;

                let clouds = 0;

                let rain = 0;

                let drizzle = 0;

                let storm = 0;

                let fog = 0;


                entries.forEach(
                    item => {

                        const condition =
                            item.weather[0].main;


                        if (
                            condition ===
                            "Clear"
                        ) {

                            clear++;

                        }

                        else if (
                            condition ===
                            "Clouds"
                        ) {

                            clouds++;

                        }

                        else if (
                            condition ===
                            "Rain"
                        ) {

                            rain++;

                        }

                        else if (
                            condition ===
                            "Drizzle"
                        ) {

                            drizzle++;

                        }

                        else if (
                            condition ===
                            "Thunderstorm"
                        ) {

                            storm++;

                        }

                        else if (
                            condition ===
                            "Mist" ||
                            condition ===
                            "Fog" ||
                            condition ===
                            "Haze"
                        ) {

                            fog++;

                        }

                    }
                );


                // =================================
                // TOTAL
                // =================================

                const total =
                    entries.length;


                // =================================
                // DEFAULT CONDITION
                // =================================

                let icon =
                    "☁️";

                let conditionText =
                    "Cloudy";


                // =================================
                // STORM
                // =================================

                if (
                    storm >= 1
                ) {

                    icon =
                        "⛈️";

                    conditionText =
                        "Storm";

                }


                // =================================
                // RAIN
                // =================================

                else if (
                    rain >= 2
                ) {

                    icon =
                        "🌧️";

                    conditionText =
                        "Rain";

                }


                // =================================
                // DRIZZLE
                // =================================

                else if (
                    drizzle >= 2
                ) {

                    icon =
                        "🌦️";

                    conditionText =
                        "Drizzle";

                }


                // =================================
                // SUNNY
                // =================================

                else if (
                    clear >= total * 0.6
                ) {

                    icon =
                        "☀️";

                    conditionText =
                        "Sunny";

                }


                // =================================
                // PARTLY CLOUDY
                // =================================

                else if (
                    clear >= 1 &&
                    clouds >= 1 &&
                    clear + clouds >=
                        total * 0.7
                ) {

                    icon =
                        "🌤️";

                    conditionText =
                        "Partly cloudy";

                }


                // =================================
                // FOG
                // =================================

                else if (
                    fog >= total * 0.5
                ) {

                    icon =
                        "🌫️";

                    conditionText =
                        "Foggy";

                }


                // =================================
                // RAIN CHANCE
                // =================================

                const rainChance =
                    Math.round(
                        Math.max(
                            ...entries.map(
                                item =>
                                    (
                                        item.pop ||
                                        0
                                    ) * 100
                            )
                        )
                    );


                // =================================
                // DATE
                // =================================

                const date =
                    new Date(
                        `${dateString}T12:00:00`
                    );


                // =================================
                // DAY
                // =================================

                const day =
                    date.toLocaleDateString(
                        "en-KE",
                        {
                            weekday:
                                "short"
                        }
                    );


                // =================================
                // ACTUAL DATE
                // =================================

                const forecastDate =
                    date.toLocaleDateString(
                        "en-KE",
                        {
                            day:
                                "numeric",

                            month:
                                "short"
                        }
                    );


                // =================================
                // CREATE CARD
                // =================================

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "forecast-day";


                card.innerHTML = `

                    <div class="forecast-day-name">
                        ${day}
                    </div>

                    <div class="forecast-date">
                        ${forecastDate}
                    </div>

                    <div class="forecast-icon">
                        ${icon}
                    </div>

                    <div class="forecast-high">
                        ${high.toFixed(0)}°C
                    </div>

                    <div class="forecast-low">
                        ${low.toFixed(0)}°C
                    </div>

                    <div class="forecast-rain">
                        💧 ${rainChance}%
                    </div>

                    <div class="forecast-condition">
                        ${conditionText}
                    </div>

                `;


                forecastContainer.appendChild(
                    card
                );

            }
        );

    }

    searchedState
) {

    document.getElementById(
        "city"

                    `Weather HTTP error: ${response.status}`

        }

                    ) {

                        message =
                            "Location permission was denied.";

                    }

                    else if (
                        error.code ===
                        error.POSITION_UNAVAILABLE
                    ) {

                        message =
                            "Your location is unavailable.";

                    }

                    else if (
                        error.code ===
                        error.TIMEOUT
                    ) {

                        message =
                            "Location request timed out.";

                    }


                    document.getElementById(
                        "error-message"
                    ).textContent =
                        message;


                    button.textContent =
                        "📍 Use My Location";

                }

            );

        }
    );


    // =================================
// DEFAULT LOCATION
// =================================

if (
    navigator.geolocation
) {

    navigator.geolocation.getCurrentPosition(

        function (position) {

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;

            getWeatherByLocation(
                latitude,
                longitude
            );

        },

        function (error) {

            // FALLBACK CITY

            getWeather(
                "Nairobi"
            );

        }

    );

}

else {

    // FALLBACK CITY

    getWeather(
        "Nairobi"
    );

}

</script>
